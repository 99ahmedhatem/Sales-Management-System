name: Extract website phone numbers

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-phones-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extract:phones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Save checkpoint
        if: always()
        run: |
          if [ ! -f scripts/extract-phones.checkpoint.json ]; then
            echo "No checkpoint file to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f scripts/extract-phones.checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(scraper): update extraction checkpoint"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi