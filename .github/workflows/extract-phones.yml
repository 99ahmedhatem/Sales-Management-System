name: extract-phones

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run extract:phones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Save checkpoint
        if: always()
        run: |
          if [ ! -f scripts/extract-phones.checkpoint.json ]; then
            echo "No checkpoint file to save."
            exit 0
          fi
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add -f scripts/extract-phones.checkpoint.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update scraper checkpoint [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi