name: extract-phones

on:
  workflow_dispatch:
    inputs:
      from_start:
        description: 'Start from the first website (true) or resume from checkpoint (false)'
        type: boolean
        default: true
      repair_only:
        description: 'Only re-check and repair websites currently marked not_working'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  extract-phones:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run phone extraction
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FROM_START: ${{ inputs.from_start }}
          REPAIR_ONLY: ${{ inputs.repair_only }}
        run: |
          ARGS=""
          if [ "$FROM_START" = "true" ] || [ "$REPAIR_ONLY" = "true" ]; then ARGS="$ARGS --from-start"; fi
          if [ "$REPAIR_ONLY" = "true" ]; then ARGS="$ARGS --repair-only"; fi
          pnpm run extract:phones -- $ARGS
      - name: Save checkpoint
        if: always()
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"
          git add scripts/extract-phones.checkpoint.json || true
          git diff --cached --quiet || git commit -m "chore: update scraper checkpoint [skip ci]"
          git pull --rebase origin main || true
          git push || true